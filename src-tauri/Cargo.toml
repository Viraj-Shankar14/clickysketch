[package]
name = "clickysketch"
version = "0.2.0"
description = "ClickySketch - a screen-aware AI tutor you talk to"
authors = ["ClickySketch contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "macos-private-api" is what lets a WKWebView be transparent; it must match
# "macOSPrivateApi" in tauri.conf.json. (It rules out the Mac App Store, which is fine for a DMG.)
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

# Debug builds copy and shrink whole screenshots pixel by pixel; unoptimised that is painfully slow.
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
